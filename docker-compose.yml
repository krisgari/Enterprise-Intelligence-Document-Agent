services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override .env's CHROMA_HOST so the API talks to the chroma
      # service above rather than an embedded local client.
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      - chroma
    volumes:
      - ./data:/app/data
    command: uvicorn ragagent.api.app:app --host 0.0.0.0 --port 8000

volumes:
  chroma_data:
